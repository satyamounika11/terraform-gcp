name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
      GCP_BUCKET: sandbox-tf-state-443817
      GCP_BUCKET_REGION: asia-south1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Write GCP credentials file from GitHub Secret
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp-key.json
          chmod 600 /tmp/gcp-key.json
          echo "✅ GCP credentials written successfully."

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sandbox-443817
          export_default_credentials: false

      - name: Authenticate gcloud with service account
        run: |
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json

      - name: Create Terraform state bucket if missing
        run: |
          if ! gsutil ls -b gs://$GCP_BUCKET >/dev/null 2>&1; then
            echo "⚠️ Bucket not found. Creating bucket: $GCP_BUCKET ..."
            gsutil mb -l $GCP_BUCKET_REGION gs://$GCP_BUCKET
            echo "✅ Bucket created successfully."
          else
            echo "✅ Bucket already exists. Continuing..."
          fi

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform Init (GCS backend)
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      # ✅ Uncomment to auto-destroy infrastructure (USE WITH EXTREME CAUTION)
      - name: Terraform Destroy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform destroy -input=false -auto-approve
